name: publish map

# Publishes a packaged map (src/package_map.py) to GitHub Pages. The map is built on a machine that has the data, attached to a release as
# straatwijsheid-map.zip, and deployed from there: the build needs hours of network access and never runs in CI. See docs/publishing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds straatwijsheid-map.zip (empty: the latest release)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the packaged map from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern straatwijsheid-map.zip
          mkdir site && unzip -q straatwijsheid-map.zip -d site
          test -f site/index.html && test -d site/data
      - name: Add Cloudflare Web Analytics (cookieless), if a token is configured
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: |
          if [ -n "$CF_BEACON_TOKEN" ]; then
            python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("site/index.html")
          tag = ('<script defer src="https://static.cloudflareinsights.com/beacon.min.js" '
                 'data-cf-beacon=\'{"token": "%s"}\'></script>' % os.environ["CF_BEACON_TOKEN"])
          s = p.read_text(encoding="utf-8")
          assert "</body>" in s
          p.write_text(s.replace("</body>", tag + "</body>", 1), encoding="utf-8")
          PY
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for the uploaded artifact to become visible
        # deploy-pages sometimes runs before the artifact it was just handed is listed ("Found 0 artifact(s)"); a short pause avoids it
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
