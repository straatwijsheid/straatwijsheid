# Copy to config.local.toml (git-ignored) and edit. Environment variables of the same meaning override these values.
# See src/config.py for the lookup order.

# A contact for polite, faster Wikidata access (sent in the User-Agent). Personal: keep it here, never commit it.
# wikidata_contact = "you@example.org"

# Where rebuildable data goes (raw/ enriched/ output/ cache/ names/). Default: build/ in this repository (git-ignored).
# build_dir = "~/straatwijsheid-build"

# The knowledge directory (hand-made overrides, corrections, vocabularies). Default: knowledge/ in this repository (git-ignored; `pipeline.py bootstrap` clones the knowledge repository there).
# knowledge_dir = "~/straatwijsheid-knowledge"

# The knowledge repository bootstrap clones from.
# knowledge_repo = "https://github.com/straatwijsheid/knowledge.git"

# The basemap tile server and the credit its terms require. The default is OpenStreetMap's public server (see NOTICE.md and docs/publishing.md for its usage policy).
# guide_url = "https://straatwijsheid.nl/meedoen/"
# tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
# tile_attribution = "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors"

# An Overpass mirror, if the default is busy.
# overpass_url = "https://overpass-api.de/api/interpreter"
